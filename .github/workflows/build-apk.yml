name: Build APK

on:
  workflow_dispatch: # se lance manuellement depuis l'onglet Actions de GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        working-directory: sekhmet-frontend
        run: npm install

      - name: Construire le web app (Lovable/Vite/TanStack Start)
        working-directory: sekhmet-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: npm run build

      - name: Vérifier l'URL compilée dans le bundle
        working-directory: sekhmet-frontend
        run: grep -o "VITE_API_BASE_URL\|http[s]*://[^\"']*" dist/client/assets/api-*.js || echo "Pattern non trouvé"

      - name: Renommer _shell.html en index.html
        working-directory: sekhmet-frontend
        run: mv dist/client/_shell.html dist/client/index.html

      - name: Installer Capacitor Android
        working-directory: sekhmet-frontend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap copy android

      - name: Copier les icônes personnalisées
        working-directory: sekhmet-frontend
        run: |
          cp -r public/android/res/mipmap-anydpi-v26/. android/app/src/main/res/mipmap-anydpi-v26/
          cp -r public/android/res/mipmap-hdpi/. android/app/src/main/res/mipmap-hdpi/
          cp -r public/android/res/mipmap-mdpi/. android/app/src/main/res/mipmap-mdpi/
          cp -r public/android/res/mipmap-xhdpi/. android/app/src/main/res/mipmap-xhdpi/
          cp -r public/android/res/mipmap-xxhdpi/. android/app/src/main/res/mipmap-xxhdpi/
          cp -r public/android/res/mipmap-xxxhdpi/. android/app/src/main/res/mipmap-xxxhdpi/

      - name: Construire l'APK (debug, signé automatiquement)
        working-directory: sekhmet-frontend/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: sekhmet-shop-admin-apk
          path: sekhmet-frontend/android/app/build/outputs/apk/debug/app-debug.apk