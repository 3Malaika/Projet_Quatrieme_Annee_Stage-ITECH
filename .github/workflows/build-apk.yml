name: Build APK

on:
  workflow_dispatch: # se lance manuellement depuis l'onglet Actions de GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        working-directory: sekhmet-frontend
        run: npm install

      - name: Construire le web app (Lovable/Vite/TanStack Start)
        working-directory: sekhmet-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: npm run build

      - name: Vérifier l'URL compilée dans le bundle
        working-directory: sekhmet-frontend
        run: grep -o "VITE_API_BASE_URL\|http[s]*://[^\"']*" dist/client/assets/api-*.js || echo "Pattern non trouvé"

      - name: Renommer _shell.html en index.html
        working-directory: sekhmet-frontend
        run: mv dist/client/_shell.html dist/client/index.html

      - name: Installer Capacitor Android
        working-directory: sekhmet-frontend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap copy android

      - name: Copier les icônes personnalisées
        working-directory: sekhmet-frontend
        run: |
          for dir in mipmap-anydpi-v26 mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp -rf public/android/res/$dir/. android/app/src/main/res/$dir/
          done
          # Créer ic_launcher_round.png depuis ic_launcher.png pour chaque densité
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp -f android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          done

      - name: Construire l'APK (debug, signé automatiquement)
        working-directory: sekhmet-frontend/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: sekhmet-shop-admin-apk
          path: sekhmet-frontend/android/app/build/outputs/apk/debug/app-debug.apk