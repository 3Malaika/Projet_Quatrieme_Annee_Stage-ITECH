name: Build EXE

on:
  workflow_dispatch: # se lance manuellement depuis l'onglet Actions de GitHub

jobs:
  build-exe:
    runs-on: windows-latest # <- la "machine Windows" pour générer le .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances (app web)
        working-directory: sekhmet-frontend
        run: npm install

      - name: Construire le web app (Lovable/Vite/TanStack Start)
        working-directory: sekhmet-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: npm run build

      - name: Renommer _shell.html en index.html
        working-directory: sekhmet-frontend
        shell: cmd
        run: ren dist\client\_shell.html index.html

      - name: Copier le build client dans electron-windows (sans le dossier server)
        working-directory: sekhmet-frontend
        run: xcopy /E /I /Y dist\client electron-windows\dist
        shell: cmd

      - name: Installer les dépendances Electron
        working-directory: sekhmet-frontend/electron-windows
        run: npm install

      - name: Rendre l'icône optionnelle si absente
        working-directory: sekhmet-frontend/electron-windows
        shell: cmd
        run: |
          if not exist icon.ico (
            node -e "const fs=require('fs');const p=require('./package.json');if(p.build&&p.build.win)delete p.build.win.icon;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          )

      - name: Construire l'EXE
        working-directory: sekhmet-frontend/electron-windows
        run: npm run dist

      - name: Publier l'EXE généré
        uses: actions/upload-artifact@v4
        with:
          name: sekhmet-shop-admin-exe
          path: sekhmet-frontend/electron-windows/dist/*.exe