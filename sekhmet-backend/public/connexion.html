<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Embedded Signup</title>
</head>
<body>

  <button id="signupButton">Connecter WhatsApp Business</button>

  <pre id="output"></pre>

  <script>
    const APP_ID = "1986323168740262";
    const CONFIG_ID = "2301078200640682";
    const GRAPH_VERSION = "v26.0";
    const BACKEND_URL = "https://projet-quatrieme-annee-stage-itech.onrender.com";

    let pendingOAuthCode = null;

    const sessionAssets = {
      phone_number_id: null,
      waba_id: null
    };

    const output = document.getElementById("output");
    const signupButton = document.getElementById("signupButton");

    function log(message, data = null) {
      console.log(message, data);

      if (data !== null) {
        output.textContent += `${message}\n${JSON.stringify(data, null, 2)}\n\n`;
      } else {
        output.textContent += `${message}\n\n`;
      }
    }

    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        cookie: true,
        xfbml: true,
        version: GRAPH_VERSION
      });

      log("✅ Facebook SDK initialisé.");
    };

    (function (d, s, id) {
      let js;
      const fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = "https://connect.facebook.net/fr_FR/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    })(document, "script", "facebook-jssdk");

    window.addEventListener("message", (event) => {
      try {
        const data =
          typeof event.data === "string"
            ? JSON.parse(event.data)
            : event.data;

        if (data?.type !== "WA_EMBEDDED_SIGNUP") {
          return;
        }

        log("📩 Événement WA_EMBEDDED_SIGNUP reçu :", data);

        const phoneNumberId =
          data?.data?.phone_number_id ||
          data?.phone_number_id ||
          null;

        const wabaId =
          data?.data?.waba_id ||
          data?.waba_id ||
          null;

        if (phoneNumberId) {
          sessionAssets.phone_number_id = phoneNumberId;
        }

        if (wabaId) {
          sessionAssets.waba_id = wabaId;
        }

        log("📦 Données Embedded Signup :", sessionAssets);

        tryCompleteOnboarding();
      } catch (error) {
        console.error("❌ Erreur traitement WA_EMBEDDED_SIGNUP :", error);
      }
    });

    function openEmbeddedSignup() {
      output.textContent = "";

      log("🚀 Ouverture de la fenêtre Embedded Signup...");

      log("⚙️ Configuration OAuth :", {
        app_id: APP_ID,
        config_id: CONFIG_ID,
        graph_version: GRAPH_VERSION
      });

      FB.login(
        (response) => {
          log("📨 Réponse reçue de FB.login :", response);

          if (!response.authResponse?.code) {
            log("❌ Aucun code OAuth reçu.");
            return;
          }

          log("✅ Code OAuth reçu.");

          pendingOAuthCode = response.authResponse.code;

          tryCompleteOnboarding();
        },
        {
          config_id: CONFIG_ID,
          response_type: "code",
          override_default_response_type: true,
          extras: {
            setup: {},
            featureType: "whatsapp_business_app_onboarding",
            sessionInfoVersion: "3"
          }
        }
      );
    }

    async function tryCompleteOnboarding() {
      if (!pendingOAuthCode) {
        return;
      }

      if (
        !sessionAssets.phone_number_id &&
        !sessionAssets.waba_id
      ) {
        log("⏳ Code OAuth reçu, attente des données Embedded Signup...");
        return;
      }

      const code = pendingOAuthCode;

      pendingOAuthCode = null;

      await exchangeCodeWithBackend(code);
    }

    async function exchangeCodeWithBackend(code) {
      log("🔄 Échange du code auprès du backend...");

      const body = {
        code,
        phone_number_id: sessionAssets.phone_number_id,
        waba_id: sessionAssets.waba_id
      };

      log("📦 Données envoyées au backend :", {
        has_code: Boolean(code),
        phone_number_id: body.phone_number_id,
        waba_id: body.waba_id
      });

      try {
        const response = await fetch(
          `${BACKEND_URL}/api/whatsapp-onboarding/exchange`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }
        );

        const data = await response.json();

        if (!response.ok) {
          log("❌ Échec de l'échange côté backend :", data);
          return;
        }

        log("✅ Échange réussi :", data);

        if (data.access_token) {
          log("🔐 Access token reçu.");
        }

        if (data.phone_number_id) {
          log("📱 Phone Number ID :", data.phone_number_id);
        }

        if (data.waba_id) {
          log("🏢 WABA ID :", data.waba_id);
        }
      } catch (error) {
        console.error("❌ Erreur communication backend :", error);
        log("❌ Erreur communication backend :", {
          message: error.message
        });
      }
    }

    signupButton.addEventListener("click", openEmbeddedSignup);
  </script>

</body>
</html>
