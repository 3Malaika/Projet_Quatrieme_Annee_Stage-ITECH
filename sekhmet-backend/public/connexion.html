<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion WhatsApp</title>
</head>

<body>
  <button id="connect-whatsapp">
    Connecter WhatsApp
  </button>

  <div id="status"></div>

  <script>
    const APP_ID = "1986323168740262";
    const CONFIG_ID = "2301078200640682";
    const GRAPH_VERSION = "v26.0";
    const BACKEND_URL = "https://projet-quatrieme-annee-stage-itech.onrender.com";

    let pendingOAuthCode = null;
    let onboardingData = null;

    function log(...args) {
      console.log("[WhatsApp Onboarding]", ...args);
    }

    function setStatus(message) {
      const element = document.getElementById("status");

      if (element) {
        element.textContent = message;
      }
    }

    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        cookie: true,
        xfbml: false,
        version: GRAPH_VERSION
      });

      log("Facebook SDK initialisé.");
    };

    function loadFacebookSDK() {
      if (document.getElementById("facebook-jssdk")) {
        return;
      }

      const script = document.createElement("script");

      script.id = "facebook-jssdk";
      script.src = "https://connect.facebook.net/fr_FR/sdk.js";
      script.async = true;
      script.defer = true;
      script.crossOrigin = "anonymous";

      document.head.appendChild(script);
    }

    function tryCompleteOnboarding() {
      if (!pendingOAuthCode) {
        log("Aucun code OAuth disponible.");
        return;
      }

      if (!onboardingData) {
        log(
          "Code OAuth reçu, attente de la fin du parcours Embedded Signup..."
        );
        return;
      }

      const payload = {
        code: pendingOAuthCode,
        business_id: onboardingData.business_id || null,
        waba_id: onboardingData.waba_id || null,
        phone_number_id: onboardingData.phone_number_id || null
      };

      log("Données prêtes pour le backend :", {
        business_id: payload.business_id,
        waba_id: payload.waba_id,
        phone_number_id: payload.phone_number_id
      });

      exchangeCode(payload);
    }

    async function exchangeCode(payload) {
      setStatus("Finalisation de la connexion WhatsApp...");

      try {
        const response = await fetch(
          `${BACKEND_URL}/api/whatsapp-onboarding/exchange`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          }
        );

        const data = await response.json();

        if (!response.ok) {
          log("Erreur backend :", data);
          setStatus(
            data?.error ||
            "Une erreur est survenue lors de la connexion WhatsApp."
          );
          return;
        }

        log("Connexion WhatsApp terminée :", {
          waba_id: data.waba_id,
          phone_number_id: data.phone_number_id
        });

        setStatus("WhatsApp a été connecté avec succès.");

        window.dispatchEvent(
          new CustomEvent("whatsapp-onboarding-complete", {
            detail: data
          })
        );
      } catch (error) {
        log("Erreur réseau :", error);
        setStatus("Impossible de contacter le serveur.");
      }
    }

    function handleEmbeddedSignupMessage(event) {
      const allowedOrigins = [
        "https://www.facebook.com",
        "https://web.facebook.com"
      ];

      if (!allowedOrigins.includes(event.origin)) {
        return;
      }

      let data = event.data;

      if (typeof data === "string") {
        try {
          data = JSON.parse(data);
        } catch {
          return;
        }
      }

      if (!data || typeof data !== "object") {
        return;
      }

      log("Message Facebook reçu :", data);

      if (data.type !== "WA_EMBEDDED_SIGNUP") {
        return;
      }

      log("Événement WA_EMBEDDED_SIGNUP reçu :", data);

      if (data.event === "ERROR") {
        log("Erreur Embedded Signup :", {
          event: data.event,
          data: data.data || null
        });

        setStatus("Meta a signalé une erreur pendant la connexion.");

        return;
      }

      if (
        data.event !== "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING" &&
        data.event !== "FINISH"
      ) {
        log("Étape Embedded Signup :", {
          event: data.event || null,
          current_step: data.data?.current_step || null
        });

        return;
      }

      onboardingData = {
        business_id:
          data.business_id ||
          data.data?.business_id ||
          null,

        waba_id:
          data.waba_id ||
          data.data?.waba_id ||
          null,

        phone_number_id:
          data.phone_number_id ||
          data.data?.phone_number_id ||
          null
      };

      log("Données Embedded Signup :", onboardingData);

      tryCompleteOnboarding();
    }

    function connectWhatsApp() {
      if (typeof FB === "undefined") {
        log("Facebook SDK non disponible.");
        setStatus("Facebook SDK non disponible.");
        return;
      }

      pendingOAuthCode = null;
      onboardingData = null;

      setStatus("Ouverture de la connexion WhatsApp...");

      log("Lancement de FB.login :", {
        app_id: APP_ID,
        config_id: CONFIG_ID,
        graph_version: GRAPH_VERSION
      });

      FB.login(
        function (response) {
          log("Réponse FB.login :", response);

          if (!response) {
            log("Aucune réponse de Facebook.");
            setStatus("Aucune réponse de Facebook.");
            return;
          }

          if (!response.authResponse) {
            log("Facebook n'a pas retourné authResponse.");
            setStatus("Connexion Facebook annulée ou interrompue.");
            return;
          }

          const code = response.authResponse.code;

          if (!code) {
            log("Aucun code OAuth dans authResponse.");
            setStatus("Aucun code OAuth reçu.");
            return;
          }

          pendingOAuthCode = code;

          log("Code OAuth reçu.");

          tryCompleteOnboarding();
        },
        {
          config_id: CONFIG_ID,
          response_type: "code",
          override_default_response_type: true,
          extras: {
            setup: {},
            featureType: "whatsapp_business_app_onboarding",
            sessionInfoVersion: "3"
          }
        }
      );
    }

    window.addEventListener(
      "message",
      handleEmbeddedSignupMessage
    );

    document.addEventListener("DOMContentLoaded", function () {
      const button = document.getElementById("connect-whatsapp");

      if (button) {
        button.addEventListener(
          "click",
          connectWhatsApp
        );
      }

      loadFacebookSDK();
    });
  </script>
</body>
</html>
